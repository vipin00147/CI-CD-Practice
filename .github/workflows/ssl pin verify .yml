name: Dynamic SSL Pin Auto Update

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# 🔒 Prevent concurrent pushes (very important)
concurrency:
  group: ssl-pin-update
  cancel-in-progress: false

jobs:

  # -----------------------------------------
  # Load domains dynamically
  # -----------------------------------------
  load_domains:
    runs-on: ubuntu-latest
    outputs:
      domains: ${{ steps.set-matrix.outputs.domains }}

    steps:
      - uses: actions/checkout@v4

      - id: set-matrix
        run: |
          DOMAINS=$(jq -c '.domains' ssl_domains.json)
          echo "domains=$DOMAINS" >> $GITHUB_OUTPUT


  # -----------------------------------------
  # Generate SSL Pin per domain
  # -----------------------------------------
  generate_pins:
    needs: load_domains
    runs-on: ubuntu-latest

    strategy:
      matrix:
        domain: ${{ fromJson(needs.load_domains.outputs.domains) }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl jq

      - name: Generate Intermediate SSL Pin
        run: |
          set -e

          DOMAIN="${{ matrix.domain }}"
          echo "🔍 Checking $DOMAIN"

          PIN=$(openssl s_client -connect $DOMAIN:443 -servername $DOMAIN -showcerts </dev/null 2>/dev/null \
            | awk '/BEGIN CERTIFICATE/{i++} i==2' \
            | openssl x509 -pubkey -noout \
            | openssl pkey -pubin -outform DER \
            | openssl dgst -sha256 -binary \
            | openssl enc -base64)

          if [ -z "$PIN" ]; then
            echo "❌ Failed to extract certificate pin"
            exit 1
          fi

          GENERATED_PIN="sha256/$PIN"
          echo "Generated Pin: $GENERATED_PIN"

          echo "{ \"${DOMAIN}\": [\"${GENERATED_PIN}\"] }" > domain.json

      - name: Upload domain artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssl-${{ matrix.domain }}
          path: domain.json


  # -----------------------------------------
  # Merge + Commit Safely
  # -----------------------------------------
  commit_changes:
    needs: generate_pins
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Merge all JSON files
        run: |
          set -e

          FINAL_FILE="app/src/main/assets/ssl_pins.json"
          mkdir -p app/src/main/assets

          FILES=""

          if [ -f "$FINAL_FILE" ]; then
            FILES="$FINAL_FILE"
          fi

          for file in $(find artifacts -name domain.json); do
            FILES="$FILES $file"
          done

          if [ -z "$FILES" ]; then
            echo "No files to merge"
            exit 0
          fi

          jq -s 'reduce .[] as $item ({}; . * $item)' $FILES > merged.json
          mv merged.json "$FINAL_FILE"

      - name: Commit & Push Safely
        run: |
          set -e

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add app/src/main/assets/ssl_pins.json

          if git diff --cached --quiet; then
            echo "✅ No changes detected"
            exit 0
          fi

          git commit -m "Auto-update SSL pins [skip ci]"

          # Retry logic to avoid race condition
          for i in {1..3}; do
            git pull --rebase origin main && break
            echo "Retrying pull..."
            sleep 2
          done

          git push origin main
