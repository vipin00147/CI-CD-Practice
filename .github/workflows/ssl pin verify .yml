name: SSL Pin Verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify_ssl:
    name: Verify SSL - ${{ matrix.domain }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        domain:
          - stageapi.currently.social
          - stagegame.currently.social
          - stage.chat.currently.social

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl jq

      - name: Generate SSL Pin (Intermediate)
        id: generate_pin
        run: |
          set -e

          DOMAIN="${{ matrix.domain }}"

          echo "🔍 Checking $DOMAIN"

          PIN=$(openssl s_client -connect $DOMAIN:443 -servername $DOMAIN -showcerts </dev/null 2>/dev/null \
            | awk '/BEGIN CERTIFICATE/{i++} i==2' \
            | openssl x509 -pubkey -noout \
            | openssl pkey -pubin -outform DER \
            | openssl dgst -sha256 -binary \
            | openssl enc -base64)

          if [ -z "$PIN" ]; then
            echo "❌ Failed to extract certificate pin"
            exit 1
          fi

          GENERATED_PIN="sha256/$PIN"

          echo "Generated Pin: $GENERATED_PIN"

          # Create domain-only JSON fragment
          echo "{ \"${DOMAIN}\": [\"${GENERATED_PIN}\"] }" > domain.json

      - name: Upload domain JSON fragment
        uses: actions/upload-artifact@v4
        with:
          name: ssl-${{ matrix.domain }}
          path: domain.json


  commit_changes:
    name: Merge & Commit
    runs-on: ubuntu-latest
    needs: verify_ssl

    steps:
      - uses: actions/checkout@v4

      - name: Download all domain artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Merge all domain JSON files
        run: |
          set -e

          FINAL_FILE="app/src/main/assets/ssl_pins.json"
          mkdir -p app/src/main/assets

          # Start from existing file if present
          if [ -f "$FINAL_FILE" ]; then
            cp "$FINAL_FILE" merged.json
          else
            echo "{}" > merged.json
          fi

          # Merge each domain fragment
          for file in $(find artifacts -name domain.json); do
            echo "Merging $file"
            jq -s '.[0] * .[1]' merged.json "$file" > tmp.json
            mv tmp.json merged.json
          done

          mv merged.json "$FINAL_FILE"

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "✅ No changes detected"
            exit 0
          fi

          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add app/src/main/assets/ssl_pins.json
          git commit -m "Auto-update SSL pins [skip ci]"
          git push
