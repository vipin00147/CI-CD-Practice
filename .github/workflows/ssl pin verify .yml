name: SSL Pin Verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify_ssl:
    name: Verify SSL - ${{ matrix.domain }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        domain:
          - stageapi.currently.social
          - stagegame.currently.social

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl jq

      - name: Generate / Verify SSL Pin
        run: |
          set -e

          DOMAIN="${{ matrix.domain }}"
          JSON_FILE="app/src/main/assets/ssl_pins.json"

          mkdir -p app/src/main/assets

          if [ ! -f "$JSON_FILE" ]; then
            echo "{}" > "$JSON_FILE"
          fi

          PIN=$(openssl s_client -connect $DOMAIN:443 -servername $DOMAIN -showcerts </dev/null 2>/dev/null \
            | awk '/BEGIN CERTIFICATE/{i++} i==2' \
            | openssl x509 -pubkey -noout \
            | openssl pkey -pubin -outform DER \
            | openssl dgst -sha256 -binary \
            | openssl enc -base64)

          if [ -z "$PIN" ]; then
            echo "❌ Failed to extract certificate pin"
            exit 1
          fi

          GENERATED_PIN="sha256/$PIN"

          if ! jq -e --arg DOMAIN "$DOMAIN" '.[$DOMAIN]' "$JSON_FILE" > /dev/null 2>&1; then
            jq --arg DOMAIN "$DOMAIN" \
               --arg PIN "$GENERATED_PIN" \
               '. + {($DOMAIN): [$PIN]}' \
               "$JSON_FILE" > tmp.json
            mv tmp.json "$JSON_FILE"
          else
            EXPECTED_PIN=$(jq -r --arg DOMAIN "$DOMAIN" '.[$DOMAIN][0]' "$JSON_FILE")

            if [ "$GENERATED_PIN" != "$EXPECTED_PIN" ]; then
              jq --arg DOMAIN "$DOMAIN" \
                 --arg PIN "$GENERATED_PIN" \
                 '.[$DOMAIN][0] = $PIN' \
                 "$JSON_FILE" > tmp.json
              mv tmp.json "$JSON_FILE"
            fi
          fi

      - name: Upload updated file
        uses: actions/upload-artifact@v4
        with:
          name: ssl-pins-${{ matrix.domain }}
          path: app/src/main/assets/ssl_pins.json

  commit_changes:
    name: Commit Changes
    runs-on: ubuntu-latest
    needs: verify_ssl

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Merge updated files
        run: |
          mkdir -p app/src/main/assets
          find artifacts -name ssl_pins.json -exec cp {} app/src/main/assets/ssl_pins.json \;

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No changes detected"
            exit 0
          fi

          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add app/src/main/assets/ssl_pins.json
          git commit -m "Auto-update SSL pins [skip ci]"
          git push
